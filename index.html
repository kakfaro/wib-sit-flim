<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی چایخانە - چای خانەی جوان</title>
    <style>
        :root {
            --bg-primary: #f5f0eb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #2c1810;
            --text-secondary: #6b4226;
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --border: #d4c5b5;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --gold: #d4a017;
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2c2c2c;
            --bg-card: #333333;
            --text-primary: #f5f0eb;
            --text-secondary: #d4c5b5;
            --accent: #e74c3c;
            --accent-light: #ff6b6b;
            --border: #4a4a4a;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #ff6b6b;
            --gold: #f0c040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            padding-bottom: 80px;
        }

        /* Header */
        .app-header {
            background: var(--bg-secondary);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--gold);
        }

        .app-header h1 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .theme-toggle {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-tab {
            padding: 14px 24px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
            color: var(--text-primary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Sections */
        .section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent);
        }

        /* Search */
        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 40px 14px 14px;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 1rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        /* Product List */
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .product-item {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .product-item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .product-item.selected {
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.1);
        }

        .product-image {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .product-price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Customer Search */
        .customer-suggestions {
            margin-top: 8px;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .suggestion-item {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestion-item:hover {
            background: rgba(192, 57, 43, 0.1);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        /* Invoice */
        .invoice-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .invoice-header {
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 4px;
        }

        /* Customer Card */
        .customer-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid var(--border);
        }

        .customer-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .product-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .nav-tab {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
            .app-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <h1>🍵 چایخانەی جوان</h1>
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">دارک مۆد</span>
            </button>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-tabs">
        <button class="nav-tab active" onclick="showSection('sales')">
            🛒 فرۆشتن
        </button>
        <button class="nav-tab" onclick="showSection('customers')">
            👥 کڕیارەکان
        </button>
        <button class="nav-tab" onclick="showSection('purchases')">
            📦 کڕین
        </button>
    </nav>

    <!-- Sales Section -->
    <section id="sales" class="section active">
        <div class="card">
            <div class="card-title">🛒 فرۆشتنی نوێ</div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="customerSearch" placeholder="گەڕان بەدوای ناوی کڕیار..." oninput="searchCustomers(this.value)">
                <div id="customerSuggestions" class="customer-suggestions"></div>
            </div>
            <div id="selectedCustomer" style="margin-bottom: 16px;"></div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="productSearch" placeholder="گەڕان بەدوای کاڵا..." oninput="filterProducts(this.value)">
            </div>
            <div id="productList" class="product-list"></div>
            <div id="selectedProducts" style="margin-top: 16px;"></div>
            <div style="margin-top: 16px;">
                <button class="btn btn-success" onclick="processSale('paid')">
                    💰 پارە وەرگیرا
                </button>
                <button class="btn btn-warning" onclick="processSale('credit')">
                    📝 قەرز
                </button>
            </div>
        </div>
    </section>

    <!-- Customers Section -->
    <section id="customers" class="section">
        <div class="card">
            <div class="card-title">👥 کڕیارەکان</div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="گەڕان بەدوای کڕیار..." oninput="filterCustomers(this.value)">
            </div>
            <div id="customerList"></div>
        </div>
    </section>

    <!-- Purchases Section -->
    <section id="purchases" class="section">
        <div class="card">
            <div class="card-title">📦 کڕینی کاڵا</div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="purchaseSearch" placeholder="گەڕان بەدوای کاڵا..." oninput="filterPurchaseProducts(this.value)">
            </div>
            <div id="purchaseProductList" class="product-list"></div>
            <div id="purchaseDetails" style="margin-top: 16px;"></div>
            <div style="margin-top: 16px;">
                <button class="btn btn-primary" onclick="processPurchase()">
                    ✅ تۆمارکردنی کڕین
                </button>
            </div>
        </div>
    </section>

    <!-- Customer Detail Modal -->
    <div id="customerDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCustomerName"></h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div id="customerDetailContent"></div>
        </div>
    </div>

    <script>
        // Data Storage
        let customers = JSON.parse(localStorage.getItem('customers')) || [];
        let products = [
            { id: 1, name: 'چای', price: 1000, icon: '🍵' },
            { id: 2, name: 'قاوە', price: 2000, icon: '☕' },
            { id: 3, name: 'شایی', price: 1500, icon: '🫖' },
            { id: 4, name: 'کەباب', price: 5000, icon: '🍢' },
            { id: 5, name: 'بەفرەو', price: 3000, icon: '🍨' },
            { id: 6, name: 'کێک', price: 2500, icon: '🍰' },
            { id: 7, name: 'پیچا', price: 4000, icon: '🍕' },
            { id: 8, name: 'نوقڵ', price: 1500, icon: '🍬' },
            { id: 9, name: 'شیرینی', price: 2000, icon: '🍪' },
            { id: 10, name: 'ئاو', price: 500, icon: '💧' },
            { id: 11, name: 'ناردن', price: 3000, icon: '🥤' },
            { id: 12, name: 'چای سەوز', price: 1200, icon: '🌿' }
        ];
        let purchases = JSON.parse(localStorage.getItem('purchases')) || [];
        let selectedCustomer = null;
        let selectedProducts = [];
        let selectedPurchaseProduct = null;
        let purchaseQuantity = 1;

        // Initialize
        function init() {
            loadTheme();
            renderProducts();
            renderCustomers();
            renderPurchaseProducts();
        }

        // Theme Toggle
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton();
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton();
        }

        function updateThemeButton() {
            const theme = document.documentElement.getAttribute('data-theme');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'لایت مۆد';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'دارک مۆد';
            }
        }

        // Navigation
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            event.target.classList.add('active');
            if (section === 'customers') renderCustomers();
            if (section === 'purchases') renderPurchaseProducts();
        }

        // Product Rendering
        function renderProducts(filter = '') {
            const container = document.getElementById('productList');
            const filtered = products.filter(p => p.name.includes(filter));
            container.innerHTML = filtered.map(p => `
                <div class="product-item ${selectedProducts.includes(p.id) ? 'selected' : ''}" onclick="toggleProduct(${p.id})">
                    <div class="product-image">${p.icon}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()} دینار</div>
                </div>
            `).join('');
            updateSelectedProductsDisplay();
        }

        function filterProducts(search) {
            renderProducts(search);
        }

        function toggleProduct(productId) {
            const index = selectedProducts.indexOf(productId);
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                selectedProducts.push(productId);
            }
            renderProducts(document.getElementById('productSearch').value);
        }

        function updateSelectedProductsDisplay() {
            const container = document.getElementById('selectedProducts');
            if (selectedProducts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">هیچ کاڵایەک هەڵنەبژێردراوە</p>';
                return;
            }
            const total = selectedProducts.reduce((sum, id) => {
                const product = products.find(p => p.id === id);
                return sum + (product ? product.price : 0);
            }, 0);
            container.innerHTML = `
                <div class="card">
                    <strong>کاڵا هەڵبژێردراوەکان:</strong>
                    <div style="margin-top: 8px;">
                        ${selectedProducts.map(id => {
                            const product = products.find(p => p.id === id);
                            return `<span style="display: inline-block; background: var(--accent); color: white; padding: 4px 8px; border-radius: 20px; margin: 2px; font-size: 0.9rem;">${product.name} - ${product.price.toLocaleString()}</span>`;
                        }).join('')}
                    </div>
                    <div style="margin-top: 12px; font-size: 1.2rem; font-weight: bold; color: var(--gold);">
                        کۆی گشتی: ${total.toLocaleString()} دینار
                    </div>
                </div>
            `;
        }

        // Customer Search
        function searchCustomers(search) {
            const container = document.getElementById('customerSuggestions');
            if (search.length < 1) {
                container.innerHTML = '';
                return;
            }
            const filtered = customers.filter(c => c.name.includes(search));
            container.innerHTML = filtered.map(c => `
                <div class="suggestion-item" onclick="selectCustomer(${c.id})">
                    <span>👤</span>
                    <span>${c.name}</span>
                </div>
            `).join('');
        }

        function selectCustomer(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (customer) {
                selectedCustomer = customer;
                document.getElementById('customerSearch').value = customer.name;
                document.getElementById('customerSuggestions').innerHTML = '';
                document.getElementById('selectedCustomer').innerHTML = `
                    <div class="card" style="background: rgba(39, 174, 96, 0.1);">
                        <strong>✅ کڕیار: ${customer.name}</strong>
                        ${customer.debt > 0 ? `<span style="color: var(--danger);"> (قەرز: ${customer.debt.toLocaleString()} دینار)</span>` : ''}
                    </div>
                `;
            }
        }

        // Process Sale
        function processSale(type) {
            if (!selectedCustomer) {
                alert('تکایە کڕیارێک هەڵبژێرە!');
                return;
            }
            if (selectedProducts.length === 0) {
                alert('تکایە کاڵا هەڵبژێرە!');
                return;
            }

            const total = selectedProducts.reduce((sum, id) => {
                const product = products.find(p => p.id === id);
                return sum + (product ? product.price : 0);
            }, 0);

            const customer = customers.find(c => c.id === selectedCustomer.id);
            const invoice = {
                id: Date.now(),
                date: new Date().toLocaleString('ckb'),
                products: selectedProducts.map(id => products.find(p => p.id === id)),
                total: total,
                type: type
            };

            if (type === 'paid') {
                invoice.paid = true;
                customer.invoices.push(invoice);
            } else {
                invoice.paid = false;
                customer.debt += total;
                customer.invoices.push(invoice);
            }

            localStorage.setItem('customers', JSON.stringify(customers));
            
            // Reset
            selectedProducts = [];
            selectedCustomer = null;
            document.getElementById('customerSearch').value = '';
            document.getElementById('selectedCustomer').innerHTML = '';
            document.getElementById('productSearch').value = '';
            renderProducts();
            
            alert('✅ فرۆشتن بە سەرکەوتوویی تۆمارکرا!');
        }

        // Render Customers
        function renderCustomers(filter = '') {
            const container = document.getElementById('customerList');
            const filtered = filter ? customers.filter(c => c.name.includes(filter)) : customers;
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">هیچ کڕیارێک نییە</p>';
                return;
            }

            container.innerHTML = filtered.map(c => `
                <div class="customer-card" onclick="showCustomerDetail(${c.id})">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong style="font-size: 1.1rem;">👤 ${c.name}</strong>
                            ${c.debt > 0 ? `<div style="color: var(--danger); margin-top: 4px;">قەرز: ${c.debt.toLocaleString()} دینار</div>` : '<div style="color: var(--success); margin-top: 4px;">✅ بێ قەرز</div>'}
                        </div>
                        <div style="color: var(--text-secondary);">
                            ${c.invoices.length} فاکتوور
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCustomers(search) {
            renderCustomers(search);
        }

        // Show Customer Detail
        function showCustomerDetail(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (!customer) return;

            document.getElementById('modalCustomerName').textContent = `👤 ${customer.name}`;
            const content = document.getElementById('customerDetailContent');
            
            let invoicesHtml = customer.invoices.length > 0 ? 
                customer.invoices.map(inv => `
                    <div class="invoice-item">
                        <div class="invoice-header">📋 فاکتووری ${inv.id}</div>
                        <div style="font-size: 0.9rem; margin-bottom: 4px;">📅 ${inv.date}</div>
                        <div style="margin-bottom: 4px;">
                            ${inv.products.map(p => `<span style="display: inline-block; margin: 2px; padding: 2px 6px; background: var(--border); border-radius: 12px; font-size: 0.85rem;">${p.icon} ${p.name}</span>`).join('')}
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <strong>کۆی گشتی: ${inv.total.toLocaleString()} دینار</strong>
                            <span style="color: ${inv.paid ? 'var(--success)' : 'var(--danger)'};">
                                ${inv.paid ? '✅ پارە درا' : '⚠️ قەرز'}
                            </span>
                        </div>
                    </div>
                `).join('') : 
                '<p style="text-align: center; color: var(--text-secondary);">هیچ فاکتوورێک نییە</p>';

            content.innerHTML = `
                <div class="card" style="margin-bottom: 16px;">
                    <strong>کۆی قەرز: </strong>
                    <span style="color: ${customer.debt > 0 ? 'var(--danger)' : 'var(--success)'}; font-size: 1.2rem;">
                        ${customer.debt.toLocaleString()} دینار
                    </span>
                </div>
                ${invoicesHtml}
            `;

            document.getElementById('customerDetailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customerDetailModal').classList.remove('active');
        }

        // Purchases Section
        function renderPurchaseProducts(filter = '') {
            const container = document.getElementById('purchaseProductList');
            const filtered = products.filter(p => p.name.includes(filter));
            container.innerHTML = filtered.map(p => `
                <div class="product-item ${selectedPurchaseProduct === p.id ? 'selected' : ''}" onclick="selectPurchaseProduct(${p.id})">
                    <div class="product-image">${p.icon}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()} دینار</div>
                </div>
            `).join('');
            updatePurchaseDetails();
        }

        function filterPurchaseProducts(search) {
            renderPurchaseProducts(search);
        }

        function selectPurchaseProduct(productId) {
            selectedPurchaseProduct = productId;
            purchaseQuantity = 1;
            renderPurchaseProducts(document.getElementById('purchaseSearch').value);
        }

        function updatePurchaseDetails() {
            const container = document.getElementById('purchaseDetails');
            if (!selectedPurchaseProduct) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">کاڵایەک هەڵبژێرە بۆ کڕین</p>';
                return;
            }
            const product = products.find(p => p.id === selectedPurchaseProduct);
            container.innerHTML = `
                <div class="card">
                    <strong>${product.icon} ${product.name}</strong>
                    <div style="margin-top: 8px;">
                        <label>بڕی کڕین:</label>
                        <input type="number" min="1" value="${purchaseQuantity}" onchange="purchaseQuantity = parseInt(this.value) || 1" style="width: 80px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);">
                    </div>
                    <div style="margin-top: 8px;">
                        <label>نرخی کڕین (دینار):</label>
                        <input type="number" min="0" value="${product.price}" id="purchasePrice" style="width: 120px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);">
                    </div>
                    <div style="margin-top: 12px;">
                        <strong>کۆی گشتی: </strong>
                        <span style="color: var(--gold);">${(purchaseQuantity * product.price).toLocaleString()} دینار</span>
                    </div>
                </div>
            `;
            const priceInput = document.getElementById('purchasePrice');
            if (priceInput) {
                priceInput.addEventListener('change', function() {
                    product.price = parseInt(this.value) || 0;
                    updatePurchaseDetails();
                    renderProducts();
                });
            }
        }

        function processPurchase() {
            if (!selectedPurchaseProduct) {
                alert('تکایە کاڵایەک هەڵبژێرە!');
                return;
            }
            const product = products.find(p => p.id === selectedPurchaseProduct);
            const purchase = {
                id: Date.now(),
                productId: product.id,
                productName: product.name,
                quantity: purchaseQuantity,
                price: product.price,
                total: purchaseQuantity * product.price,
                date: new Date().toLocaleString('ckb')
            };
            purchases.push(purchase);
            localStorage.setItem('purchases', JSON.stringify(purchases));
            
            selectedPurchaseProduct = null;
            purchaseQuantity = 1;
            document.getElementById('purchaseSearch').value = '';
            renderPurchaseProducts();
            alert('✅ کڕین بە سەرکەوتوویی تۆمارکرا!');
        }

        // Add sample customer (for testing)
        function addSampleCustomer() {
            if (customers.length === 0) {
                customers.push({
                    id: 1,
                    name: 'ئاری',
                    debt: 0,
                    invoices: []
                });
                customers.push({
                    id: 2,
                    name: 'سارا',
                    debt: 0,
                    invoices: []
                });
                localStorage.setItem('customers', JSON.stringify(customers));
                renderCustomers();
            }
        }

        // Initialize app
        init();
        addSampleCustomer();
    </script>
</body>
</html>
