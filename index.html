<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی چایخانە - چای خانەی جوان</title>
    <style>
        :root {
            --bg-primary: #f5f0eb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #2c1810;
            --text-secondary: #6b4226;
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --border: #d4c5b5;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --gold: #d4a017;
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2c2c2c;
            --bg-card: #333333;
            --text-primary: #f5f0eb;
            --text-secondary: #d4c5b5;
            --accent: #e74c3c;
            --accent-light: #ff6b6b;
            --border: #4a4a4a;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #ff6b6b;
            --gold: #f0c040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            padding-bottom: 80px;
        }

        .app-header {
            background: var(--bg-secondary);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--gold);
        }

        .app-header h1 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .theme-toggle {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-tab {
            padding: 14px 24px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
            color: var(--text-primary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 40px 14px 14px;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 1rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .product-item {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
        }

        .product-item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .product-item.selected {
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.1);
        }

        .product-item .product-image {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-item .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .product-price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .customer-suggestions {
            margin-top: 8px;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .suggestion-item {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestion-item:hover {
            background: rgba(192, 57, 43, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        .invoice-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .invoice-header {
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .customer-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .customer-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .customer-card .customer-info {
            flex: 1;
        }

        .customer-card .customer-actions {
            display: flex;
            gap: 8px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity-control button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .quantity-control button:hover {
            border-color: var(--accent);
        }

        .quantity-control span {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .product-management {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .product-management input {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            flex: 1;
            min-width: 120px;
        }

        .product-management input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .product-image-preview {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .inventory-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .inventory-item .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .inventory-item .item-info img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .inventory-item .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .inventory-item .price-edit {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .inventory-item .price-edit input {
            width: 100px;
            padding: 6px 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .inventory-item .price-edit input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .debt-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            border: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .debt-item .debt-info {
            flex: 1;
        }

        .debt-item .debt-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .debt-item .debt-actions input {
            width: 120px;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .debt-item .debt-actions input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .settlement-history {
            max-height: 300px;
            overflow-y: auto;
        }

        .settlement-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 480px) {
            .product-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .nav-tab {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
            .app-header h1 {
                font-size: 1.4rem;
            }
            .customer-card {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .customer-card .customer-actions {
                justify-content: flex-end;
            }
            .debt-item {
                flex-direction: column;
                align-items: stretch;
            }
            .debt-item .debt-actions {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .inventory-item .price-edit input {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>🍵 چایخانەی جوان</h1>
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">دارک مۆد</span>
            </button>
        </div>
    </header>

    <nav class="nav-tabs">
        <button class="nav-tab active" onclick="showSection('sales')">🛒 فرۆشتن</button>
        <button class="nav-tab" onclick="showSection('customers')">👥 کڕیارەکان</button>
        <button class="nav-tab" onclick="showSection('inventory')">📦 مخزن</button>
        <button class="nav-tab" onclick="showSection('purchases')">📥 کڕین</button>
        <button class="nav-tab" onclick="showSection('settlements')">💰 واسڵ</button>
    </nav>

    <!-- Sales Section -->
    <section id="sales" class="section active">
        <div class="card">
            <div class="card-title">🛒 فرۆشتنی نوێ</div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="customerSearch" placeholder="گەڕان بەدوای ناوی کڕیار..." oninput="searchCustomers(this.value)">
                <div id="customerSuggestions" class="customer-suggestions"></div>
            </div>
            <div id="selectedCustomer" style="margin-bottom: 16px;"></div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="productSearch" placeholder="گەڕان بەدوای کاڵا..." oninput="filterProducts(this.value)">
            </div>
            <div id="productList" class="product-list"></div>
            <div id="selectedProducts" style="margin-top: 16px;"></div>
            <div style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-success" onclick="processSale('paid')">💰 پارە وەرگیرا</button>
                <button class="btn btn-warning" onclick="processSale('credit')">📝 قەرز</button>
            </div>
        </div>
    </section>

    <!-- Customers Section -->
    <section id="customers" class="section">
        <div class="card">
            <div class="card-title">👥 کڕیارەکان</div>
            <div style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
                <input type="text" id="newCustomerName" placeholder="ناوی کڕیاری نوێ..." style="flex:1; min-width:150px; padding:10px 14px; border:2px solid var(--border); border-radius:8px; background:var(--bg-secondary); color:var(--text-primary);">
                <button class="btn btn-success" onclick="addCustomer()">➕ زیادکردن</button>
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="گەڕان بەدوای کڕیار..." oninput="filterCustomers(this.value)">
            </div>
            <div id="customerList"></div>
        </div>
    </section>

    <!-- Inventory Section -->
    <section id="inventory" class="section">
        <div class="card">
            <div class="card-title">📦 مخزن - بەڕێوەبردنی کاڵاکان</div>
            <div class="product-management">
                <input type="text" id="newProductName" placeholder="ناوی کاڵا...">
                <input type="number" id="newProductPrice" placeholder="نرخی فرۆشتن...">
                <div class="file-upload-wrapper">
                    <button class="btn btn-primary" style="pointer-events: none;">📷 وێنه</button>
                    <input type="file" id="newProductImage" accept="image/*">
                </div>
                <button class="btn btn-success" onclick="addProduct()">➕ زیادکردن</button>
            </div>
            <div id="inventoryList"></div>
        </div>
    </section>

    <!-- Purchases Section -->
    <section id="purchases" class="section">
        <div class="card">
            <div class="card-title">📥 کڕینی کاڵا</div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="purchaseSearch" placeholder="گەڕان بەدوای کاڵا..." oninput="filterPurchaseProducts(this.value)">
            </div>
            <div id="purchaseProductList" class="product-list"></div>
            <div id="purchaseDetails" style="margin-top: 16px;"></div>
            <div style="margin-top: 16px;">
                <button class="btn btn-primary" onclick="processPurchase()">✅ تۆمارکردنی کڕین</button>
            </div>
        </div>
    </section>

    <!-- Settlements Section -->
    <section id="settlements" class="section">
        <div class="card">
            <div class="card-title">💰 واسڵکردنی پارە</div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="debtSearch" placeholder="گەڕان بەدوای ناوی کەس..." oninput="renderDebtList(this.value)">
            </div>
            <div id="debtList"></div>
        </div>
    </section>

    <!-- Customer Detail Modal -->
    <div id="customerDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCustomerName"></h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div id="customerDetailContent"></div>
        </div>
    </div>

    <script>
        // Data Storage
        let customers = JSON.parse(localStorage.getItem('customers')) || [];
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let purchases = JSON.parse(localStorage.getItem('purchases')) || [];
        let settlements = JSON.parse(localStorage.getItem('settlements')) || [];
        let selectedCustomerId = null; // ONLY store the ID, not the whole object
        let selectedProducts = [];
        let selectedPurchaseProduct = null;
        let purchaseQuantity = 1;

        // Default products if empty
        if (products.length === 0) {
            products = [
                { id: 1, name: 'چای', price: 1000, icon: '🍵', image: '' },
                { id: 2, name: 'قاوە', price: 2000, icon: '☕', image: '' },
                { id: 3, name: 'شایی', price: 1500, icon: '🫖', image: '' },
                { id: 4, name: 'کەباب', price: 5000, icon: '🍢', image: '' },
                { id: 5, name: 'بەفرەو', price: 3000, icon: '🍨', image: '' },
                { id: 6, name: 'کێک', price: 2500, icon: '🍰', image: '' },
                { id: 7, name: 'پیچا', price: 4000, icon: '🍕', image: '' },
                { id: 8, name: 'نوقڵ', price: 1500, icon: '🍬', image: '' },
                { id: 9, name: 'شیرینی', price: 2000, icon: '🍪', image: '' },
                { id: 10, name: 'ئاو', price: 500, icon: '💧', image: '' },
                { id: 11, name: 'ناردن', price: 3000, icon: '🥤', image: '' },
                { id: 12, name: 'چای سەوز', price: 1200, icon: '🌿', image: '' }
            ];
            localStorage.setItem('products', JSON.stringify(products));
        }

        // Initialize
        function init() {
            loadTheme();
            renderProducts();
            renderCustomers();
            renderPurchaseProducts();
            renderInventory();
            renderDebtList();
        }

        // Theme Toggle
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton();
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton();
        }

        function updateThemeButton() {
            const theme = document.documentElement.getAttribute('data-theme');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'لایت مۆد';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'دارک مۆد';
            }
        }

        // Navigation
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(t => {
                if (t.textContent.includes('🛒 فرۆشتن') && section === 'sales') t.classList.add('active');
                if (t.textContent.includes('👥 کڕیارەکان') && section === 'customers') t.classList.add('active');
                if (t.textContent.includes('📦 مخزن') && section === 'inventory') t.classList.add('active');
                if (t.textContent.includes('📥 کڕین') && section === 'purchases') t.classList.add('active');
                if (t.textContent.includes('💰 واسڵ') && section === 'settlements') t.classList.add('active');
            });
            if (section === 'customers') renderCustomers();
            if (section === 'inventory') renderInventory();
            if (section === 'purchases') renderPurchaseProducts();
            if (section === 'settlements') renderDebtList();
        }

        // Product Rendering for Sales
        function renderProducts(filter = '') {
            const container = document.getElementById('productList');
            const filtered = products.filter(p => p.name.includes(filter));
            container.innerHTML = filtered.map(p => {
                const isSelected = selectedProducts.some(item => item.productId === p.id);
                return `
                <div class="product-item ${isSelected ? 'selected' : ''}" onclick="toggleProduct(${p.id})">
                    <div class="product-image">
                        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.icon}
                    </div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()} دینار</div>
                </div>
            `}).join('');
            updateSelectedProductsDisplay();
        }

        function filterProducts(search) {
            renderProducts(search);
        }

        function toggleProduct(productId) {
            const index = selectedProducts.findIndex(item => item.productId === productId);
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                const product = products.find(p => p.id === productId);
                if (product) {
                    selectedProducts.push({ productId: product.id, quantity: 1 });
                }
            }
            renderProducts(document.getElementById('productSearch').value);
        }

        function updateProductQuantity(productId, change) {
            const item = selectedProducts.find(p => p.productId === productId);
            if (item) {
                item.quantity = Math.max(1, item.quantity + change);
                updateSelectedProductsDisplay();
            }
        }

        function updateSelectedProductsDisplay() {
            const container = document.getElementById('selectedProducts');
            if (selectedProducts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">هیچ کاڵایەک هەڵنەبژێردراوە</p>';
                return;
            }
            const total = selectedProducts.reduce((sum, item) => {
                const product = products.find(p => p.id === item.productId);
                return sum + (product ? product.price * item.quantity : 0);
            }, 0);
            container.innerHTML = `
                <div class="card">
                    <strong>کاڵا هەڵبژێردراوەکان:</strong>
                    ${selectedProducts.map(item => {
                        const product = products.find(p => p.id === item.productId);
                        return `<div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);">
                            <span>${product ? `${product.icon} ${product.name}` : ''}</span>
                            <div class="quantity-control" style="margin:0;">
                                <button onclick="updateProductQuantity(${item.productId}, -1)">−</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateProductQuantity(${item.productId}, 1)">+</button>
                            </div>
                            <span style="color:var(--gold);">${(product ? product.price * item.quantity : 0).toLocaleString()} دینار</span>
                        </div>`;
                    }).join('')}
                    <div style="margin-top: 12px; font-size: 1.2rem; font-weight: bold; color: var(--gold);">
                        کۆی گشتی: ${total.toLocaleString()} دینار
                    </div>
                </div>
            `;
        }

        // Get the selected customer object from the ID
        function getSelectedCustomer() {
            if (selectedCustomerId === null) return null;
            return customers.find(c => c.id === selectedCustomerId) || null;
        }

        // Customer Search
        function searchCustomers(search) {
            const container = document.getElementById('customerSuggestions');
            if (search.length < 1) {
                container.innerHTML = '';
                return;
            }
            const filtered = customers.filter(c => c.name.includes(search));
            container.innerHTML = filtered.map(c => `
                <div class="suggestion-item" onclick="selectCustomer(${c.id})">
                    <span>👤</span>
                    <span>${c.name}</span>
                </div>
            `).join('');
        }

        function selectCustomer(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (customer) {
                selectedCustomerId = customer.id; // Store only the ID
                document.getElementById('customerSearch').value = customer.name;
                document.getElementById('customerSuggestions').innerHTML = '';
                
                // Refresh the customer display with fresh data
                updateSelectedCustomerDisplay();
            }
        }

        function updateSelectedCustomerDisplay() {
            const customer = getSelectedCustomer();
            if (!customer) {
                document.getElementById('selectedCustomer').innerHTML = '';
                return;
            }
            document.getElementById('selectedCustomer').innerHTML = `
                <div class="card" style="background: rgba(39, 174, 96, 0.1);">
                    <strong>✅ کڕیار: ${customer.name}</strong>
                    ${customer.debt > 0 ? `<span style="color: var(--danger);"> (قەرز: ${customer.debt.toLocaleString()} دینار)</span>` : ''}
                </div>
            `;
        }

        // Process Sale
        function processSale(type) {
            const customer = getSelectedCustomer();
            if (!customer) {
                alert('تکایە کڕیارێک هەڵبژێرە!');
                return;
            }
            if (selectedProducts.length === 0) {
                alert('تکایە کاڵا هەڵبژێرە!');
                return;
            }

            const total = selectedProducts.reduce((sum, item) => {
                const product = products.find(p => p.id === item.productId);
                return sum + (product ? product.price * item.quantity : 0);
            }, 0);

            // Get the latest customer data
            const customerIndex = customers.findIndex(c => c.id === customer.id);
            if (customerIndex === -1) {
                alert('کڕیار نەدۆزرایەوە!');
                return;
            }

            const invoice = {
                id: Date.now(),
                date: new Date().toLocaleString('ckb'),
                products: selectedProducts.map(item => {
                    const product = products.find(p => p.id === item.productId);
                    return { ...product, quantity: item.quantity };
                }),
                total: total,
                type: type,
                paid: type === 'paid'
            };

            if (type === 'credit') {
                customers[customerIndex].debt += total;
            }
            customers[customerIndex].invoices.push(invoice);

            localStorage.setItem('customers', JSON.stringify(customers));

            // Reset
            selectedProducts = [];
            selectedCustomerId = null;
            document.getElementById('customerSearch').value = '';
            document.getElementById('selectedCustomer').innerHTML = '';
            document.getElementById('productSearch').value = '';
            renderProducts();
            renderDebtList();

            alert('✅ فرۆشتن بە سەرکەوتوویی تۆمارکرا!');
        }

        // Customer Management
        function addCustomer() {
            const nameInput = document.getElementById('newCustomerName');
            const name = nameInput.value.trim();
            if (!name) {
                alert('تکایە ناوی کڕیار بنووسە!');
                return;
            }
            if (customers.some(c => c.name === name)) {
                alert('ئەم کڕیارە پێشتر تۆمارکراوە!');
                return;
            }
            const newCustomer = {
                id: Date.now(),
                name: name,
                debt: 0,
                invoices: []
            };
            customers.push(newCustomer);
            localStorage.setItem('customers', JSON.stringify(customers));
            nameInput.value = '';
            renderCustomers();
            renderDebtList();
            alert('✅ کڕیار زیادکرا!');
        }

        function deleteCustomer(id) {
            if (!confirm('دڵنیای لە سڕینەوەی ئەم کڕیارە؟')) return;
            customers = customers.filter(c => c.id !== id);
            localStorage.setItem('customers', JSON.stringify(customers));
            if (selectedCustomerId === id) {
                selectedCustomerId = null;
                document.getElementById('selectedCustomer').innerHTML = '';
                document.getElementById('customerSearch').value = '';
            }
            renderCustomers();
            renderDebtList();
        }

        function renderCustomers(filter = '') {
            const container = document.getElementById('customerList');
            const filtered = filter ? customers.filter(c => c.name.includes(filter)) : customers;

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">هیچ کڕیارێک نییە</p>';
                return;
            }

            container.innerHTML = filtered.map(c => `
                <div class="customer-card">
                    <div class="customer-info" onclick="showCustomerDetail(${c.id})" style="cursor:pointer;">
                        <strong style="font-size: 1.1rem;">👤 ${c.name}</strong>
                        ${c.debt > 0 ? `<div style="color: var(--danger); margin-top: 4px;">قەرز: ${c.debt.toLocaleString()} دینار</div>` : '<div style="color: var(--success); margin-top: 4px;">✅ بێ قەرز</div>'}
                        <div style="color: var(--text-secondary); font-size: 0.9rem;">${c.invoices.length} فاکتوور</div>
                    </div>
                    <div class="customer-actions">
                        <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${c.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCustomers(search) {
            renderCustomers(search);
        }

        // Show Customer Detail
        function showCustomerDetail(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (!customer) return;

            document.getElementById('modalCustomerName').textContent = `👤 ${customer.name}`;
            const content = document.getElementById('customerDetailContent');

            let invoicesHtml = customer.invoices.length > 0 ?
                customer.invoices.map(inv => `
                    <div class="invoice-item">
                        <div class="invoice-header">📋 فاکتووری ${inv.id}</div>
                        <div style="font-size: 0.9rem; margin-bottom: 4px;">📅 ${inv.date}</div>
                        <div style="margin-bottom: 4px;">
                            ${inv.products.map(p => `<span style="display: inline-block; margin: 2px; padding: 2px 6px; background: var(--border); border-radius: 12px; font-size: 0.85rem;">${p.icon || '📦'} ${p.name} (${p.quantity}x)</span>`).join('')}
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <strong>کۆی گشتی: ${inv.total.toLocaleString()} دینار</strong>
                            <span style="color: ${inv.paid ? 'var(--success)' : 'var(--danger)'};">
                                ${inv.paid ? '✅ پارە درا' : '⚠️ قەرز'}
                            </span>
                        </div>
                    </div>
                `).join('') :
                '<p style="text-align: center; color: var(--text-secondary);">هیچ فاکتوورێک نییە</p>';

            content.innerHTML = `
                <div class="card" style="margin-bottom: 16px;">
                    <strong>کۆی قەرز: </strong>
                    <span style="color: ${customer.debt > 0 ? 'var(--danger)' : 'var(--success)'}; font-size: 1.2rem;">
                        ${customer.debt.toLocaleString()} دینار
                    </span>
                </div>
                ${invoicesHtml}
            `;

            document.getElementById('customerDetailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customerDetailModal').classList.remove('active');
        }

        // Inventory Management
        function renderInventory() {
            const container = document.getElementById('inventoryList');
            if (products.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">هیچ کاڵایەک نییە لە مخزن</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="inventory-item">
                    <div class="item-info">
                        <div class="product-image" style="width:40px;height:40px;font-size:1.8rem;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;">
                            ${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : p.icon}
                        </div>
                        <div>
                            <div><strong>${p.name}</strong></div>
                            <div class="price-edit">
                                <span style="color:var(--gold);">نرخ:</span>
                                <input type="number" value="${p.price}" min="0" onchange="updateProductPrice(${p.id}, this.value)">
                                <span>دینار</span>
                            </div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function updateProductPrice(productId, newPrice) {
            const price = parseInt(newPrice);
            if (isNaN(price) || price < 0) {
                alert('تکایە نرخێکی دروست بنووسە!');
                renderInventory();
                return;
            }
            const product = products.find(p => p.id === productId);
            if (product) {
                product.price = price;
                localStorage.setItem('products', JSON.stringify(products));
                renderProducts();
                renderInventory();
                renderPurchaseProducts();
            }
        }

        function addProduct() {
            const nameInput = document.getElementById('newProductName');
            const priceInput = document.getElementById('newProductPrice');
            const imageInput = document.getElementById('newProductImage');

            const name = nameInput.value.trim();
            const price = parseInt(priceInput.value);

            if (!name) {
                alert('تکایە ناوی کاڵا بنووسە!');
                return;
            }
            if (isNaN(price) || price <= 0) {
                alert('تکایە نرخی دروست بنووسە!');
                return;
            }

            const newProduct = {
                id: Date.now(),
                name: name,
                price: price,
                icon: '📦',
                image: ''
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    newProduct.image = e.target.result;
                    products.push(newProduct);
                    localStorage.setItem('products', JSON.stringify(products));
                    renderInventory();
                    renderProducts();
                    renderPurchaseProducts();
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                products.push(newProduct);
                localStorage.setItem('products', JSON.stringify(products));
                renderInventory();
                renderProducts();
                renderPurchaseProducts();
            }

            nameInput.value = '';
            priceInput.value = '';
            imageInput.value = '';
            alert('✅ کاڵا زیادکرا!');
        }

        function deleteProduct(id) {
            if (!confirm('دڵنیای لە سڕینەوەی ئەم کاڵایە؟')) return;
            products = products.filter(p => p.id !== id);
            localStorage.setItem('products', JSON.stringify(products));
            renderInventory();
            renderProducts();
            renderPurchaseProducts();
        }

        // Purchases Section
        function renderPurchaseProducts(filter = '') {
            const container = document.getElementById('purchaseProductList');
            const filtered = products.filter(p => p.name.includes(filter));
            container.innerHTML = filtered.map(p => `
                <div class="product-item ${selectedPurchaseProduct === p.id ? 'selected' : ''}" onclick="selectPurchaseProduct(${p.id})">
                    <div class="product-image">
                        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.icon}
                    </div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()} دینار</div>
                </div>
            `).join('');
            updatePurchaseDetails();
        }

        function filterPurchaseProducts(search) {
            renderPurchaseProducts(search);
        }

        function selectPurchaseProduct(productId) {
            selectedPurchaseProduct = productId;
            purchaseQuantity = 1;
            renderPurchaseProducts(document.getElementById('purchaseSearch').value);
        }

        function updatePurchaseDetails() {
            const container = document.getElementById('purchaseDetails');
            if (!selectedPurchaseProduct) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">کاڵایەک هەڵبژێرە بۆ کڕین</p>';
                return;
            }
            const product = products.find(p => p.id === selectedPurchaseProduct);
            container.innerHTML = `
                <div class="card">
                    <strong>${product.icon} ${product.name}</strong>
                    <div style="margin-top: 8px;">
                        <label>بڕی کڕین:</label>
                        <div class="quantity-control">
                            <button onclick="purchaseQuantity = Math.max(1, purchaseQuantity - 1); updatePurchaseDetails();">−</button>
                            <span>${purchaseQuantity}</span>
                            <button onclick="purchaseQuantity = purchaseQuantity + 1; updatePurchaseDetails();">+</button>
                        </div>
                    </div>
                    <div style="margin-top: 8px;">
                        <label>نرخی کڕین (دینار):</label>
                        <input type="number" min="0" value="${product.price}" id="purchasePrice" style="width: 120px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);">
                    </div>
                    <div style="margin-top: 12px;">
                        <strong>کۆی گشتی: </strong>
                        <span style="color: var(--gold);">${(purchaseQuantity * product.price).toLocaleString()} دینار</span>
                    </div>
                </div>
            `;
            const priceInput = document.getElementById('purchasePrice');
            if (priceInput) {
                priceInput.addEventListener('change', function() {
                    const p = products.find(pr => pr.id === selectedPurchaseProduct);
                    if (p) {
                        p.price = parseInt(this.value) || 0;
                        localStorage.setItem('products', JSON.stringify(products));
                        renderProducts();
                        renderInventory();
                        updatePurchaseDetails();
                    }
                });
            }
        }

        function processPurchase() {
            if (!selectedPurchaseProduct) {
                alert('تکایە کاڵایەک هەڵبژێرە!');
                return;
            }
            const product = products.find(p => p.id === selectedPurchaseProduct);
            const purchase = {
                id: Date.now(),
                productId: product.id,
                productName: product.name,
                quantity: purchaseQuantity,
                price: product.price,
                total: purchaseQuantity * product.price,
                date: new Date().toLocaleString('ckb')
            };
            purchases.push(purchase);
            localStorage.setItem('purchases', JSON.stringify(purchases));

            selectedPurchaseProduct = null;
            purchaseQuantity = 1;
            document.getElementById('purchaseSearch').value = '';
            renderPurchaseProducts();
            alert('✅ کڕین بە سەرکەوتوویی تۆمارکرا!');
        }

        // ============ PAYMENT SETTLEMENT (واسڵکردنی پارە) ============
        function renderDebtList(filter = '') {
            const container = document.getElementById('debtList');
            const debtCustomers = customers.filter(c => c.debt > 0);
            const filtered = filter ? debtCustomers.filter(c => c.name.includes(filter)) : debtCustomers;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; color: var(--text-secondary);">
                        ${customers.some(c => c.debt > 0) ? 'هیچ کەسێک نەدۆزرایەوە' : 'هیچ قەرزێک نییە! 🎉'}
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(c => {
                const customerSettlements = settlements.filter(s => s.customerId === c.id);
                return `
                    <div class="debt-item">
                        <div class="debt-info">
                            <strong style="font-size: 1.1rem;">👤 ${c.name}</strong>
                            <div style="color: var(--danger); font-size: 1.1rem; margin-top: 4px;">
                                کۆی قەرز: ${c.debt.toLocaleString()} دینار
                            </div>
                            <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 2px;">
                                ${customerSettlements.length} جار واسڵ کراوە
                            </div>
                        </div>
                        <div class="debt-actions">
                            <input type="number" id="settlementAmount_${c.id}" placeholder="بڕی پارە..." min="1" max="${c.debt}">
                            <button class="btn btn-success btn-sm" onclick="processSettlement(${c.id})">
                                💰 واسڵ
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="showSettlementHistory(${c.id})">
                                📋 مێژوو
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function processSettlement(customerId) {
            const customerIndex = customers.findIndex(c => c.id === customerId);
            if (customerIndex === -1) return;
            
            const customer = customers[customerIndex];
            const amountInput = document.getElementById(`settlementAmount_${customerId}`);
            const amount = parseInt(amountInput.value);

            if (!amount || amount <= 0) {
                alert('تکایە بڕی پارەی دروست بنووسە!');
                return;
            }

            if (amount > customer.debt) {
                alert(`قەرزی ئەم کەسە ${customer.debt.toLocaleString()} دینارە! ناتوانیت زیاتر لەوە واسڵ بکەیت.`);
                return;
            }

            const settlement = {
                id: Date.now(),
                customerId: customer.id,
                customerName: customer.name,
                amount: amount,
                date: new Date().toLocaleString('ckb'),
                remainingDebt: customer.debt - amount
            };

            customer.debt -= amount;
            localStorage.setItem('customers', JSON.stringify(customers));

            settlements.push(settlement);
            localStorage.setItem('settlements', JSON.stringify(settlements));

            amountInput.value = '';
            renderDebtList(document.getElementById('debtSearch').value);
            renderCustomers();
            
            // Update the selected customer display if this customer is selected
            if (selectedCustomerId === customerId) {
                updateSelectedCustomerDisplay();
            }

            alert(`✅ واسڵ بە سەرکەوتوویی تۆمارکرا! 
        بڕی پارە: ${amount.toLocaleString()} دینار
        قەرزی ماوە: ${customer.debt.toLocaleString()} دینار`);
        }

        function showSettlementHistory(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (!customer) return;

            const customerSettlements = settlements.filter(s => s.customerId === customerId);

            document.getElementById('modalCustomerName').textContent = `📋 مێژووی واسڵ - ${customer.name}`;
            const content = document.getElementById('customerDetailContent');

            if (customerSettlements.length === 0) {
                content.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">هیچ واسڵێک بۆ ئەم کەسە تۆمار نەکراوە</p>';
            } else {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 16px;">
                        <strong>کۆی قەرزی ئێستا: </strong>
                        <span style="color: ${customer.debt > 0 ? 'var(--danger)' : 'var(--success)'}; font-size: 1.2rem;">
                            ${customer.debt.toLocaleString()} دینار
                        </span>
                    </div>
                    <div class="settlement-history">
                        ${customerSettlements.map(s => `
                            <div class="settlement-item">
                                <div>
                                    <div style="font-weight: bold;">💰 ${s.amount.toLocaleString()} دینار</div>
                                    <div style="font-size: 0.85rem; color: var(--text-secondary);">${s.date}</div>
                                </div>
                                <div style="color: var(--text-secondary); font-size: 0.85rem;">
                                    قەرزی ماوە: ${s.remainingDebt.toLocaleString()} دینار
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            document.getElementById('customerDetailModal').classList.add('active');
        }

        // Initialize app
        init();
    </script>
</body>
</html>
