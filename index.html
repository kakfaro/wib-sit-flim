<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕی پەخشکردنی فیلم</title>
    <style>
        /* CSS Settings for Dark Theme & Responsive Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #e50914;
        }

        /* Container for responsive video embed */
        .video-player {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-details {
            margin-top: 20px;
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
        }

        .movie-details p {
            color: #aaaaaa;
            line-height: 1.6;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ناوی فیلمەکە بە کوردی</h1>

        <div class="video-player">
            <iframe 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                title="Movie Player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="movie-details">
            <h2>دربارەی فیلم</h2>
            <p>لێرەدا کورته‌ى چیرۆکی فیلمەکە یان زانیارییەکان (وەک ساڵی دەرچوون، جۆری فیلم، و ئەکتەرەکان) دەنووسیت.</p>
        </div>
    </div>

</body>
</html>
